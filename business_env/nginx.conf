events {
    worker_connections 1024;
}

http {
    # 使用 map 自动把 4xx 和 5xx 状态码映射为 ERROR 级别，其他为 INFO
    map $status $log_level {
        ~^[45]  ERROR;
        default INFO;
    }

    # 定义纯 JSON 格式的日志，直接对齐后端的 ES 搜索格式
    log_format json_logs escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"server_id":"1",'
        '"log_type":"nginx",'
        '"service_name":"nginx-web",'
        '"log_level":"$log_level",'
        '"status":$status,'
        '"message":"$remote_addr requested $request -> $status"'
    '}';

    # 将访问日志按 json_logs 格式输出
    access_log /var/log/nginx/access.log json_logs;
    error_log /var/log/nginx/error.log notice;

    server {
        listen 80;

        # 正常路由
        location / {
            return 200 "Welcome to the real business server!\n";
        }

        # 真实的业务代理：当压测打满时，后端响应慢了自然会产生真实的 502/504 Timeout Error
        location /api/ {
            proxy_pass http://192.168.245.1:5000;
            proxy_connect_timeout 2s; # 为了容易压出超时报错，设短一点
            proxy_read_timeout 2s;
        }
    }
}
